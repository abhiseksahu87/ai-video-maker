<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI YouTube Video Maker</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:system-ui,sans-serif
}
.wrap{
  max-width:760px;
  margin:auto;
  padding:24px 16px
}
h1{font-size:30px;margin:0 0 8px}
.sub{color:#aab4c8;margin-bottom:24px}
.card{
  background:#151d32;
  border:1px solid #293653;
  border-radius:18px;
  padding:20px
}
label{
  display:block;
  font-weight:700;
  margin:16px 0 8px
}
input,select,textarea{
  width:100%;
  background:#0d1528;
  color:#fff;
  border:1px solid #39476a;
  border-radius:12px;
  padding:14px;
  font-size:16px
}
textarea{
  min-height:150px;
  resize:vertical
}
button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#6366f1;
  color:white;
  font-size:18px;
  font-weight:800
}
button:disabled{opacity:.6}
#status{
  margin-top:18px;
  color:#aab4c8;
  white-space:pre-wrap
}
#result{
  display:none;
  margin-top:20px
}
#script{
  white-space:pre-wrap;
  line-height:1.6;
  background:#0d1528;
  padding:16px;
  border-radius:12px;
  border:1px solid #39476a
}
</style>
</head>

<body>

<div class="wrap">

<h1>🎬 AI YouTube Video Maker</h1>

<div class="sub">
Create long-form YouTube scripts from a topic.
</div>

<div class="card">

<label>Video Topic</label>

<textarea id="topic"
placeholder="Example: The rise of the Maurya Empire and how Chandragupta Maurya built one of India's greatest empires."></textarea>

<label>Language</label>

<select id="language">
<option value="English">English</option>
<option value="Hindi">Hindi</option>
<option value="Hinglish">Hinglish</option>
</select>

<label>Target Duration</label>

<select id="duration">
<option value="5">5 minutes</option>
<option value="10" selected>10 minutes</option>
<option value="15">15 minutes</option>
<option value="20">20 minutes</option>
<option value="30">30 minutes</option>
</select>

<button id="generate">
Generate YouTube Script
</button>

<div id="status"></div>

<div id="result">
<h2>Generated Script</h2>
<div id="script"></div>
</div>

</div>
</div>

<script>

const btn = document.getElementById("generate");
const status = document.getElementById("status");
const result = document.getElementById("result");
const scriptBox = document.getElementById("script");

btn.onclick = async () => {

  const topic = document.getElementById("topic").value.trim();
  const language = document.getElementById("language").value;
  const duration = Number(document.getElementById("duration").value);

  if (!topic) {
    status.textContent = "❌ Please enter a video topic.";
    return;
  }

  btn.disabled = true;
  result.style.display = "none";
  status.textContent = "⏳ Creating your YouTube script...";

  try {

    const response = await fetch("/api/script", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        topic: topic,
        language: language,
        duration_minutes: duration
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "Something went wrong.");
    }

    scriptBox.textContent = data.script;
    result.style.display = "block";
    status.textContent = "✅ Script created successfully!";

  } catch (error) {

    status.textContent = "❌ " + error.message;

  } finally {

    btn.disabled = false;

  }
};

</script>

</body>
</html>
