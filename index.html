<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI YouTube Video Maker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:system-ui,sans-serif
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:24px 16px
}

h1{
  font-size:30px;
  margin:0 0 8px
}

.sub{
  color:#aab4c8;
  margin-bottom:24px
}

.card{
  background:#151d32;
  border:1px solid #293653;
  border-radius:18px;
  padding:20px
}

label{
  display:block;
  font-weight:700;
  margin:16px 0 8px
}

input,select,textarea{
  width:100%;
  background:#0d1528;
  color:#fff;
  border:1px solid #39476a;
  border-radius:12px;
  padding:14px;
  font-size:16px
}

textarea{
  min-height:150px;
  resize:vertical
}

button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#6366f1;
  color:white;
  font-size:18px;
  font-weight:800
}

button:disabled{
  opacity:.6
}

.secondary{
  background:#374151
}

#status{
  margin-top:18px;
  color:#aab4c8;
  white-space:pre-wrap
}

#result,
#voiceResult,
#sceneResult{
  display:none;
  margin-top:20px
}

#script,
#scenes{
  white-space:pre-wrap;
  line-height:1.6;
  background:#0d1528;
  padding:16px;
  border-radius:12px;
  border:1px solid #39476a;
  max-height:600px;
  overflow-y:auto
}

audio{
  width:100%;
  margin-top:12px
}

.download{
  display:block;
  text-align:center;
  text-decoration:none;
  margin-top:14px;
  padding:14px;
  border-radius:12px;
  background:#374151;
  color:white;
  font-weight:700
}
</style>
</head>

<body>

<div class="wrap">

<h1>🎬 AI YouTube Video Maker</h1>

<div class="sub">
Create long-form YouTube scripts, voiceovers and scene plans.
</div>

<div class="card">

<label>Video Topic</label>

<textarea
id="topic"
placeholder="Example: The rise of the Maurya Empire and how Chandragupta Maurya built one of India's greatest empires."
></textarea>

<label>Language</label>

<select id="language">
<option value="English">English</option>
<option value="Hindi">Hindi</option>
<option value="Hinglish">Hinglish</option>
</select>

<label>Target Duration</label>

<select id="duration">
<option value="5">5 minutes</option>
<option value="10" selected>10 minutes</option>
<option value="15">15 minutes</option>
<option value="20">20 minutes</option>
<option value="30">30 minutes</option>
</select>

<button id="generate">
📝 Generate YouTube Script
</button>

<div id="status"></div>

<div id="result">

<h2>📝 Generated Script</h2>

<div id="script"></div>

<button id="voice">
🎙️ Generate Voiceover
</button>

<button id="scenesButton" class="secondary">
🎨 Generate Scene Prompts
</button>

</div>

<div id="voiceResult">

<h2>🎙️ Voiceover</h2>

<audio id="audio" controls></audio>

<a
id="download"
class="download"
href="#"
download="voiceover.wav"
>
⬇️ Download Voiceover
</a>

</div>

<div id="sceneResult">

<h2>🎨 Scene Visual Plan</h2>

<div id="scenes"></div>

</div>

</div>
</div>

<script>

const generateButton =
document.getElementById("generate");

const voiceButton =
document.getElementById("voice");

const scenesButton =
document.getElementById("scenesButton");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const scriptBox =
document.getElementById("script");

const voiceResult =
document.getElementById("voiceResult");

const sceneResult =
document.getElementById("sceneResult");

const scenesBox =
document.getElementById("scenes");

const audio =
document.getElementById("audio");

const download =
document.getElementById("download");


/* =========================
   GENERATE SCRIPT
========================= */

generateButton.onclick = async () => {

const topic =
document.getElementById("topic").value.trim();

const language =
document.getElementById("language").value;

const duration =
Number(
document.getElementById("duration").value
);

if(!topic){

status.textContent =
"❌ Please enter a video topic.";

return;
}

generateButton.disabled = true;
voiceButton.disabled = true;
scenesButton.disabled = true;

result.style.display = "none";
voiceResult.style.display = "none";
sceneResult.style.display = "none";

status.textContent =
"⏳ Creating your YouTube script...";

try{

const response =
await fetch(
"/api/script",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
topic:topic,
language:language,
duration_minutes:duration
})
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.detail ||
"Something went wrong."
);
}

scriptBox.textContent =
data.script;

result.style.display =
"block";

status.textContent =
"✅ Script created successfully!";

voiceButton.disabled = false;
scenesButton.disabled = false;

}
catch(error){

status.textContent =
"❌ " + error.message;

}
finally{

generateButton.disabled = false;

}

};


/* =========================
   GENERATE VOICEOVER
========================= */

voiceButton.onclick = async () => {

const script =
scriptBox.textContent.trim();

const language =
document.getElementById("language").value;

if(!script){

status.textContent =
"❌ No script available.";

return;
}

voiceButton.disabled = true;

status.textContent =
"🎙️ Generating voiceover...";

try{

const response =
await fetch(
"/api/voice",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
text:script,
language:language
})
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.detail ||
"Voice generation failed."
);
}

audio.src =
data.audio_url;

download.href =
data.audio_url;

voiceResult.style.display =
"block";

status.textContent =
"✅ Voiceover created successfully!";

}
catch(error){

status.textContent =
"❌ " + error.message;

}
finally{

voiceButton.disabled = false;

}

};


/* =========================
   GENERATE SCENE PROMPTS
========================= */

scenesButton.onclick = async () => {

const script =
scriptBox.textContent.trim();

if(!script){

status.textContent =
"❌ No script available.";

return;
}

scenesButton.disabled = true;

sceneResult.style.display =
"none";

status.textContent =
"🎨 Creating cinematic scene prompts...";

try{

const response =
await fetch(
"/api/scenes",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
script:script
})
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.detail ||
"Scene generation failed."
);
}

scenesBox.textContent =
data.scenes;

sceneResult.style.display =
"block";

status.textContent =
"✅ Scene visual plan created!";

}
catch(error){

status.textContent =
"❌ " + error.message;

}
finally{

scenesButton.disabled = false;

}

};

</script>

</body>
</html>
